name: Deploy D3vil World News to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  newsletter:
    # Only ever fires on a real push to main — never on a manual
    # workflow_dispatch re-run. Manual re-runs are for testing the deploy
    # job only; test the newsletter HTML locally with
    # `node -e "require('./scripts/send-newsletter.js').buildEmailHtml(...)"`
    # instead, which never touches the live Kit API. Mirrors D3vil Sports'
    # newsletter job exactly, added 2026-09-14 — see scripts/send-newsletter.js
    # for the subscriber-tag scoping that keeps this list separate from Sports'.
    #
    # BUG FOUND AND FIXED 2026-09-19: this used to only fire on a file the
    # push *added* (--diff-filter=A). That's exactly right for the
    # automated routine's own first push each day, but it silently
    # SKIPPED whenever a same-day follow-up push only *modified* that
    # day's already-existing post file — which is exactly what happens
    # when an empty/incomplete region gets caught and fixed after the
    # routine's initial (incomplete) publish. Result: the newsletter that
    # actually went out on 9/16, 9/17, and 9/18 was the routine's
    # first-draft version, missing regions that were filled in minutes
    # to hours later — subscribers never saw the corrected edition. Now
    # detects add-OR-modify, scoped specifically to *today's* dated post
    # file (not any posts/*.html), so a same-day correction re-sends the
    # fixed version, while edits to older historical posts (rare, e.g. a
    # site-wide rebrand touching many files) don't accidentally trigger
    # a resend for a different day's already-settled edition. Trade-off:
    # a same-day correction now sends two emails that day instead of
    # zero-then-stale-one — annoying, but far better than subscribers
    # never getting the accurate edition at all.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect today's post changing
        id: detect
        run: |
          TODAY_POST="posts/$(date -u +%Y-%m-%d).html"
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- "$TODAY_POST")
          if [ -z "$CHANGED" ]; then
            echo "No change to today's post ($TODAY_POST) in this push — skipping newsletter send."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "Today's post changed: $CHANGED"
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$CHANGED" >> "$GITHUB_OUTPUT"
          fi

      # Debounce (added 2026-10-19): the daily routine publishes, then self-reviews and
      # pushes a correction ~5 minutes later, and every push that touches today's post used to
      # send its own email -- so subscribers got two per site per day. Now each run waits for
      # the burst to settle, then only the run holding the LATEST version of today's post
      # sends; earlier runs see a newer version on main and stand down. One email, final text.
      # A correction pushed more than ~20 minutes after the previous push still sends again.
      - name: Wait for the push burst to settle
        if: steps.detect.outputs.found == 'true'
        run: sleep 1200

      - name: Stand down if a newer version of today's post exists
        id: settle
        if: steps.detect.outputs.found == 'true'
        run: |
          FILE="${{ steps.detect.outputs.file }}"
          git fetch --quiet origin main
          if git show "origin/main:$FILE" 2>/dev/null | cmp -s - "$FILE"; then
            echo "This run holds the latest version of $FILE - sending."
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "A newer version of $FILE is on main (or it was removed) - a later run will send, standing down."
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi

      # Quality gate (added 2026-10-16 after the thin Oct 3 edition emailed out, then a second corrected
      # email followed): if 2+ of the 5 regions shipped on the "Nothing met this edition's bar" placeholder,
      # HOLD the send and fail this job (red X = visible in the daily check). The site still deploys.
      # Once the regions are filled and today's post is pushed again, this job re-runs on that push and
      # sends the good edition, so subscribers get ONE email, the right one. One quiet region still sends.
      - name: Quality gate (hold thin editions)
        id: gate
        if: steps.detect.outputs.found == 'true' && steps.settle.outputs.superseded == 'false'
        run: |
          EMPTY=$(grep -o "Nothing met this edition" "${{ steps.detect.outputs.file }}" | wc -l)
          echo "Empty regions: $EMPTY"
          if [ "$EMPTY" -ge 2 ]; then
            echo "::error::$EMPTY regions are empty placeholders. Newsletter HELD. Fill the regions and push today's post again to send."
            exit 1
          fi

      - name: Send newsletter
        if: steps.detect.outputs.found == 'true' && steps.settle.outputs.superseded == 'false'
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          POST_FILE: ${{ steps.detect.outputs.file }}
        run: node scripts/send-newsletter.js

  # No audio recap job — explicitly out of scope for this site (D3vil
  # Sports has the weekly recap; this one was never meant to).
