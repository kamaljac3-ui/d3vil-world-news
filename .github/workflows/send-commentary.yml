name: Send commentary broadcast

# Manual-only, workflow_dispatch. Sends a one-off Kit broadcast for a
# Commentary piece (see commentary/ and scripts/send-commentary.js).
# Never fires on push -- commentary pieces are published manually and
# each send is a deliberate action, triggered here on purpose.
#
# Leave target_tag_id blank to send to the WHOLE Kit account (both
# Sports and World News subscribers) -- kamal's explicit choice for
# commentary pieces, same as the standing policy for daily digests.
# Set it to test first against a single tag (e.g. 23420871 for
# owner-test-send, kamaljac3@gmail.com) before a real full-account send.

on:
  workflow_dispatch:
    inputs:
      commentary_file:
        description: "Path to the commentary HTML file, e.g. commentary/the-fall-of-the-empire.html"
        required: true
      subject:
        description: "Email subject line"
        required: true
      target_tag_id:
        description: "Kit tag ID to scope a TEST send to. Leave blank to send to the WHOLE account -- be careful."
        required: false

jobs:
  send-commentary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Send commentary broadcast
        env:
          KIT_API_KEY: ${{ secrets.KIT_API_KEY }}
          COMMENTARY_FILE: ${{ inputs.commentary_file }}
          SUBJECT: ${{ inputs.subject }}
          TARGET_TAG_ID: ${{ inputs.target_tag_id }}
        run: node scripts/send-commentary.js
